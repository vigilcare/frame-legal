<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Returning to Frame Video Studio</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f2ed; color: #172037; font: 17px/1.5 "Segoe UI", sans-serif; }
    main { width: min(520px, calc(100% - 48px)); padding: 42px; border-radius: 20px; background: white; box-shadow: 0 18px 50px rgba(23, 32, 55, .14); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: #596174; }
  </style>
</head>
<body>
  <main>
    <h1>Returning to Frame Video Studio…</h1>
    <p>Keep Frame open. This window will close when the Facebook connection is complete.</p>
  </main>
  <script>
    const allowed = ["code", "state", "error", "error_reason", "error_description"];
    const incoming = new URLSearchParams(window.location.search);
    const outgoing = new URLSearchParams();
    for (const key of allowed) {
      if (incoming.has(key)) outgoing.set(key, incoming.get(key));
    }
    window.location.replace("http://localhost:53682/api/meta/callback?" + outgoing.toString());
  </script>
</body>
</html>
